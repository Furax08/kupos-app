        // --- UTILITY FUNCTIONS ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgCol = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-brand-600';
            toast.className = `${bgCol} text-white px-4 py-3 rounded-xl shadow-xl flex items-center justify-between gap-3 text-sm animate-bounce duration-300`;
            toast.innerHTML = `<span><i class="fa-solid fa-circle-info mr-2"></i>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function copyToClipboard(text, label) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(`${label} copiado al portapapeles con éxito.`);
            } catch (err) {
                showToast('Error al copiar al portapapeles', 'error');
            }
            document.body.removeChild(textarea);
        }

        function formatCurrency(amountUSD) {
            const r = appState.rates;
            const primary = (amountUSD * r.primaryRate).toFixed(2);
            const secondary = (amountUSD * r.secondaryRate).toFixed(2);
            return `$${amountUSD.toFixed(2)} USD <span class="text-xs text-slate-400 font-normal">(${primary} ${r.primaryCurrency} / ${secondary} ${r.secondaryCurrency})</span>`;
        }

        // --- RENDER ROUTER ---
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            // Check view routing
            if (appState.view === 'auth') {
                app.innerHTML = renderAuthScreen();
            } else if (appState.view === 'admin') {
                app.innerHTML = renderAdminScreen();
            } else if (appState.view === 'setup') {
                app.innerHTML = renderStoreSetupScreen();
            } else if (appState.view === 'main') {
                app.innerHTML = renderMainDashboard();
            } else if (appState.view === 'public_catalog') {
                app.innerHTML = renderPublicCatalogScreen();

                                <label class="block text-xs font-medium text-slate-300 mb-1">Contraseña 🔑</label>

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value;

            // Check Admin
            if (email === ADMIN_EMAIL) {
                const adminUser = appState.users.find(u => u.email === ADMIN_EMAIL);
                appState.currentUser = adminUser;
                saveState();
                appState.view = 'admin';
                render();
                showToast('Bienvenido al Panel Secreto de Administrador 👑');
                return;
            }

            const found = appState.users.find(u => u.email === email);
            if (!found) {
                showToast('Usuario no encontrado. Por favor regístrese.', 'error');
                return;
            }

            if (found.status !== 'approved') {
                showToast('Tu cuenta está pendiente de aprobación por el administrador.', 'error');
                return;
            }

            appState.currentUser = found;
            saveState();

            if (!found.storeName) {
                appState.view = 'setup';
            } else {
                appState.view = 'main';
            }
            render();
            showToast(`¡Bienvenido de nuevo, ${found.email}!`);
        }

        function handleRegisterStart(e) {
            e.preventDefault();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value;
            const plan = document.getElementById('reg-plan').value;

            if (appState.users.some(u => u.email === email)) {
                showToast('Este correo ya está registrado.', 'error');
                return;
            }

            const token = 'TKN-' + Math.random().toString(36).substring(2, 8).toUpperCase();
            pendingRegData = { email, pass, plan, token, status: 'pending', role: 'user' };
            authMode = 'payment';
            render();
        }

        function submitPaymentProof(e) {
            e.preventDefault();
            const ref = document.getElementById('pay-ref').value;
            if (!ref) {
                showToast('Por favor ingresa la referencia de pago.', 'error');
                return;
            }

            pendingRegData.paymentRef = ref;
            appState.users.push(pendingRegData);
            saveState();

            authMode = 'pending';
            render();
            showToast('¡Comprobante enviado con éxito!');
        }

        function applyAuthCoupon() {
            const codeInput = document.getElementById('auth-coupon-code').value.trim().toUpperCase();
            const coupon = appState.coupons.find(c => c.code === codeInput);
            if (!coupon) {
                showToast('Código de canje inválido o inexistente.', 'error');
                return;
            }

            if (pendingRegData) {
                pendingRegData.status = 'approved';
                appState.users.push(pendingRegData);
                saveState();
                appState.currentUser = pendingRegData;
                appState.view = 'setup';
                render();
                showToast('¡Código canjeado con éxito! Cuenta aprobada instantáneamente.');
            } else {
                showToast('Por favor inicia el registro con correo y contraseña primero.', 'error');
            }
        }

        function addToCart(productId) {
            const product = appState.products.find(p => p.id === productId);
            if (!product || product.stock <= 0) {
                showToast('Producto sin stock disponible.', 'error');
                return;
            }

            const activeCart = appState.carts.find(c => c.id === appState.activeCartId);
            const existing = activeCart.items.find(i => i.id === productId);
            if (existing) {
                if (existing.qty >= product.stock) {
                    showToast('No hay más stock disponible para este producto.', 'error');
                    return;
                }
                existing.qty++;
            } else {
                activeCart.items.push({ ...product, qty: 1 });
            }
            saveState();
            render();
            showToast(`Agregado a ${activeCart.name}`);
        }

        function updateCartItemQty(productId, delta) {
            const activeCart = appState.carts.find(c => c.id === appState.activeCartId);
            const item = activeCart.items.find(i => i.id === productId);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    activeCart.items = activeCart.items.filter(i => i.id !== productId);
                }
                saveState();
                render();
            }
        }

        function removeCartItem(productId) {
            const activeCart = appState.carts.find(c => c.id === appState.activeCartId);
            activeCart.items = activeCart.items.filter(i => i.id !== productId);
            saveState();
            render();
        }

        function addNewCart() {
            if (appState.carts.length >= 5) {
                showToast('Máximo 5 carritos simultáneos permitidos.', 'error');
                return;
            }
            const names = ['Carrito de Pedro', 'María', 'Cliente Express', 'Mayorista', 'VIP'];
            const newName = names[appState.carts.length] || `Carrito ${appState.carts.length + 1}`;
            const newId = 'c' + (appState.carts.length + 1);
            appState.carts.push({ id: newId, name: newName, items: [] });
            appState.activeCartId = newId;
            saveState();
            render();
            showToast(`Nuevo carrito abierto: ${newName}`);
        }

        function switchCart(cartId) {
            appState.activeCartId = cartId;
            saveState();
            render();
        }

        function calcChange(total) {
            const received = parseFloat(document.getElementById('checkout-received').value) || 0;
            const change = received - total;
            const display = document.getElementById('change-display');
            display.innerHTML = `Vuelto / Cambio: <span class="font-bold ${change >= 0 ? 'text-emerald-400' : 'text-rose-400'}">$${change >= 0 ? change.toFixed(2) : '0.00'}</span>`;
        }

        function completeSale(status) {
            const activeCart = appState.carts.find(c => c.id === appState.activeCartId);
            const total = activeCart.items.reduce((sum, item) => sum + (item.price * item.qty), 0);

            // Deduct stock
            activeCart.items.forEach(cartItem => {
                const prod = appState.products.find(p => p.id === cartItem.id);
                if (prod) prod.stock -= cartItem.qty;
            });

            // Record sale
            appState.salesHistory.push({
                id: 'SALE-' + Date.now(),
                cartName: activeCart.name,
                items: [...activeCart.items],
                total,
                date: new Date().toLocaleString()
            });

            // Clear cart
            activeCart.items = [];
            saveState();
            closeModal();
            render();
            showToast('¡Venta completada con éxito! Stock actualizado.');
        }

                    <div class="flex gap-2">
                        <button onclick="copyToClipboard('${catalogUrl}', 'Link del Catálogo')" class="bg-brand-600 hover:bg-brand-500 text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-brand-600/30"><i class="fa-solid fa-copy mr-2"></i>Copiar Link</button>
                        <button onclick="appState.view='public_catalog'; render();" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2.5 rounded-xl text-xs font-semibold">Ver Vista Cliente 👁️</button>
                    </div>
                </div>

                <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl">
                    <h3 class="text-sm font-bold text-white mb-4">Productos en el Catálogo Público</h3>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                        ${appState.products.map(p => `
                            <div class="bg-slate-900 border border-slate-700 p-3 rounded-xl">
                                <img src="${p.image}" class="w-full h-24 object-cover rounded-lg mb-2">
                                <h4 class="font-bold text-white text-xs truncate">${p.name}</h4>
                                <span class="text-xs font-extrabold text-emerald-400">$${p.price.toFixed(2)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>`;
        }

        // Public Catalog View (Simulated Customer View)
        function renderPublicCatalogScreen() {
            const user = appState.currentUser;
            return `
            <div class="min-h-screen bg-slate-900 flex flex-col">
                <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between">
                    <div>
                        <h1 class="font-extrabold text-white text-lg">${user?.storeName || 'Tienda Virtual'}</h1>
                        <p class="text-xs text-brand-400">Catálogo Oficial verificado (Token: ${user?.token})</p>
                    </div>
                    <button onclick="appState.view='main'; mainTab='catalog'; render();" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-xs font-semibold">← Volver al Panel</button>
                </header>

                <main class="flex-1 p-6 max-w-5xl mx-auto w-full space-y-6">
                    <div class="bg-gradient-to-r from-brand-600 to-violet-600 p-6 rounded-3xl text-white shadow-xl flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-extrabold">¡Bienvenido a nuestro mostrador virtual!</h2>
                            <p class="text-xs opacity-90 mt-1">Selecciona tus productos y envíanos el pedido directamente por WhatsApp.</p>
                        </div>
                        <i class="fa-brands fa-whatsapp text-4xl opacity-80"></i>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                        ${appState.products.map(p => `
                            <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl flex flex-col justify-between shadow-lg">
                                <div>
                                    <img src="${p.image}" class="w-full h-32 object-cover rounded-xl mb-3 bg-slate-900">
                                    <h3 class="font-bold text-white text-xs line-clamp-2">${p.name}</h3>
                                </div>
                                <div class="mt-4 pt-3 border-t border-slate-700 flex items-center justify-between">
                                    <span class="text-sm font-extrabold text-emerald-400">$${p.price.toFixed(2)}</span>
                                    <button onclick="showToast('Pedido simulado enviado por WhatsApp 📱')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl text-xs font-semibold">Pedir 🛒</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </main>
            </div>`;
        }


        // --- 8. ADDITIONAL MODULES (Caja & Expenses, Metrics, Export) ---
        function renderCajaTab() {
            return `
            <div class="space-y-6 max-w-4xl mx-auto">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl">
                        <span class="text-xs text-slate-400 uppercase font-semibold">Estado de Caja</span>
                        <div class="text-2xl font-extrabold text-emerald-400 mt-2">ABIERTA 🟢</div>
                        <span class="text-xs text-slate-400 block mt-1">Desde: ${appState.caja.openedAt}</span>
                    </div>
                    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl">
                        <span class="text-xs text-slate-400 uppercase font-semibold">Efectivo en Caja</span>
                        <div class="text-2xl font-extrabold text-white mt-2">$${appState.caja.cashSalesUSD.toFixed(2)}</div>
                    </div>
                    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl">
                        <span class="text-xs text-slate-400 uppercase font-semibold">Ventas Totales del Día</span>
                        <div class="text-2xl font-extrabold text-brand-400 mt-2">$${(appState.caja.cashSalesUSD + appState.caja.cardSalesUSD).toFixed(2)}</div>
                    </div>
                </div>

                <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl">
                    <h3 class="text-sm font-bold text-white mb-4">Registro de Gastos Operativos</h3>
                    <div class="space-y-3">
                        ${appState.expenses.map(e => `
                            <div class="bg-slate-900 border border-slate-700 p-3 rounded-xl flex items-center justify-between text-xs">
                                <div>
                                    <span class="font-bold text-white block">${e.description}</span>
                                    <span class="text-slate-400">Fecha: ${e.date}</span>
                                </div>
                                <span class="font-extrabold text-rose-400">-$${e.amount.toFixed(2)} USD</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>`;
        }

        function renderMetricsTab() {
            const totalRevenue = appState.salesHistory.reduce((s, sale) => s + sale.total, 0);
            return `
            <div class="space-y-6 max-w-4xl mx-auto">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl">
                        <h3 class="text-sm font-bold text-white mb-2">Ventas Totales Registradas</h3>
                        <div class="text-3xl font-extrabold text-emerald-400">$${totalRevenue.toFixed(2)}</div>
                        <p class="text-xs text-slate-400 mt-1">${appState.salesHistory.length} transacciones completadas hoy.</p>
                    </div>
                    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl">
                        <h3 class="text-sm font-bold text-white mb-2">Valor Total del Inventario</h3>
                        <div class="text-3xl font-extrabold text-brand-400">$${appState.products.reduce((s, p) => s + (p.cost * p.stock), 0).toFixed(2)}</div>
                        <p class="text-xs text-slate-400 mt-1">Inversión actual en mercancía.</p>
                    </div>
                </div>
            </div>`;
        }

        function renderExportTab() {
            return `
            <div class="space-y-6 max-w-4xl mx-auto">
                <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl flex items-center justify-between">
                    <div>
                        <h3 class="text-base font-bold text-white mb-1">Exportar Inventario a Excel (CSV)</h3>
                        <p class="text-xs text-slate-400">Descarga tu base de datos de productos en formato compatible con Excel.</p>
                    </div>
                    <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 rounded-xl text-xs font-semibold shadow-lg shadow-emerald-600/30"><i class="fa-solid fa-file-excel mr-2"></i>Descargar CSV</button>
                </div>
                <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl flex items-center justify-between">
                    <div>
                        <h3 class="text-base font-bold text-white mb-1">Exportar Base de Datos (JSON)</h3>
                        <p class="text-xs text-slate-400">Respaldo completo de inventario, ventas y configuración en formato JSON.</p>
                    </div>
                    <button onclick="exportJSON()" class="bg-brand-600 hover:bg-brand-500 text-white px-5 py-3 rounded-xl text-xs font-semibold shadow-lg shadow-brand-600/30"><i class="fa-solid fa-code mr-2"></i>Descargar JSON</button>
                </div>
            </div>`;
        }

        function exportCSV() {
            let csv = 'ID,Nombre,Marca,Categoría,Costo,Precio,Stock\n';
            appState.products.forEach(p => {
                csv += `"${p.id}","${p.name}","${p.brand}","${p.category}",${p.cost},${p.price},${p.stock}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'inventario_mi_tienda.csv';
            link.click();
            showToast('Archivo CSV descargado con éxito.');
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "respaldo_mi_tienda.json");
            dlAnchor.click();
            showToast('Respaldo JSON descargado con éxito.');
        }

        // Initialize App on Load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
